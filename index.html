<title>JIJI List</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Sixtyfour&family=Libre+Franklin:wght@400;500;600;700&family=Archivo+Expanded:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Hanken+Grotesk:wght@400;500;600;700&family=Big+Shoulders+Stencil:wght@600;800&family=Caveat:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  /* ---------- tokens per mode ---------- */
  :root{
    --radius-page: 22px;
    --maxw: 880px;
  }
  html[data-mode="radio"]{
    --bg:#180f2b; --bg-2:#22163d; --housing:#6b4b8f; --housing-2:#4a3266;
    --face:#e9defa; --screen-bg:#160f28; --ink:#e9defa; --ink-soft:#c3a8ec;
    --list-ink:#ece3fb; --list-ink-soft:#b39bda; --list-bg:#1c1333; --list-row:#2a1c47;
    --accent:#8b5cf6; --led:#d9b8ff; --line:#3d2a5c;
    --font-a:'Big Shoulders Display','Arial Narrow',sans-serif;
    --font-b:'Libre Franklin',system-ui,sans-serif;
    --font-c:'Sixtyfour','Courier New',monospace;
    --radius-lg:28px; --radius-sm:10px;
  }
  html[data-mode="ipod"]{
    --bg:#f0eafc; --bg-2:#e4d8f7; --housing:#fbf8ff; --housing-2:#d8caf0;
    --face:#e7defc; --screen-bg:#e7defc; --ink:#352a4d; --ink-soft:#7c6a9c;
    --list-ink:#352a4d; --list-ink-soft:#8672ab; --list-bg:#f6f1fd; --list-row:#ffffff;
    --accent:#7c5cff; --led:#352a4d; --line:#d8caf0;
    --font-a:'Archivo Expanded',Arial,sans-serif;
    --font-b:'Hanken Grotesk',system-ui,sans-serif;
    --font-c:'JetBrains Mono','Courier New',monospace;
    --radius-lg:36px; --radius-sm:14px;
  }
  html[data-mode="cassette"]{
    --bg:#e6dcf3; --bg-2:#d9c9ee; --housing:#8a5fb0; --housing-2:#5e3f80;
    --face:#f2ebfb; --screen-bg:#f2ebfb; --ink:#3d2a5c; --ink-soft:#7a5fa0;
    --list-ink:#3d2a5c; --list-ink-soft:#8a72ad; --list-bg:#f2ebfb; --list-row:#e6d8f5;
    --accent:#a855f7; --led:#3d2a5c; --line:#c9b3e6;
    --font-a:'Big Shoulders Stencil','Arial Narrow',sans-serif;
    --font-b:'IBM Plex Mono','Courier New',monospace;
    --font-c:'Caveat',cursive;
    --radius-lg:10px; --radius-sm:4px;
  }
  html[data-mode="vinyl"]{
    --bg:#140b22; --bg-2:#1e1333; --housing:#2a1c42; --housing-2:#3a2757;
    --face:#0d0818; --screen-bg:#0d0818; --ink:#e9defa; --ink-soft:#b7a0d9;
    --list-ink:#ece3fb; --list-ink-soft:#a68fcf; --list-bg:#180f28; --list-row:#241a3d;
    --accent:#b98ffb; --led:#c9a6ff; --line:#3a2757;
    --font-a:'Fraunces',Georgia,serif;
    --font-b:'Work Sans',system-ui,sans-serif;
    --font-c:'Fraunces',Georgia,serif;
    --radius-lg:16px; --radius-sm:6px;
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html{ color-scheme: dark light; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--font-b);
    transition: background .5s ease, color .5s ease;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  button{ font-family:inherit; }
  input{ font-family:inherit; }

  .page{
    max-width:var(--maxw); margin:0 auto; padding: clamp(20px,4vw,48px) clamp(16px,4vw,28px) 64px;
  }

  /* ---------- header ---------- */
  .eyebrow{
    font-family:var(--font-b); font-weight:600; font-size:.7rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin:0 0 10px;
  }
  h1.title{
    font-family:var(--font-a); font-weight:800; font-size:clamp(2.2rem,7vw,3.4rem); line-height:.95;
    margin:0 0 10px; text-wrap:balance; letter-spacing:.01em;
  }
  html[data-mode="vinyl"] h1.title{ font-weight:600; font-style:italic; letter-spacing:0; }
  .kicker{
    font-size:.95rem; color:var(--ink-soft); margin:0 0 28px; max-width:52ch; line-height:1.6;
  }
  .kicker bdi{ unicode-bidi:isolate; }

  /* ---------- mode switcher ---------- */
  .switcher{
    display:flex; flex-wrap:wrap; gap:10px; margin-bottom:34px;
  }
  .mode-btn{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line); background:var(--bg-2); color:var(--ink);
    padding:10px 16px; border-radius:999px; cursor:pointer;
    font-size:.85rem; font-weight:600; font-family:var(--font-b);
    transition: background .25s ease, color .25s ease, border-color .25s ease, transform .15s ease;
  }
  .mode-btn .ico{ font-size:1.05em; line-height:1; }
  .mode-btn:hover{ transform: translateY(-1px); }
  .mode-btn[aria-pressed="true"]{
    background:var(--accent); border-color:var(--accent); color:var(--screen-bg);
  }
  html[data-mode="ipod"] .mode-btn[aria-pressed="true"]{ color:#fff; }
  .mode-btn:focus-visible, button:focus-visible, input:focus-visible, .track-row:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ---------- device stage (shared shell) ---------- */
  .stage{
    background:var(--housing);
    border-radius:var(--radius-lg);
    padding: clamp(20px,4vw,34px);
    margin-bottom:28px;
    position:relative;
    overflow:hidden;
    box-shadow: 0 18px 40px -20px rgba(0,0,0,.55);
  }
  .device-visual{ display:none; }
  html[data-mode="radio"] .device-visual[data-for="radio"],
  html[data-mode="ipod"] .device-visual[data-for="ipod"],
  html[data-mode="cassette"] .device-visual[data-for="cassette"],
  html[data-mode="vinyl"] .device-visual[data-for="vinyl"]{ display:block; }

  .now-playing-text{
    font-family:var(--font-c); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ===== RADIO ===== */
  .radio-body{ display:flex; flex-direction:column; gap:18px; }
  .radio-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .radio-brand{ font-family:var(--font-c); color:var(--face); font-size:.85rem; letter-spacing:.06em; }
  .radio-brand b{ display:block; font-size:1.1rem; }
  .dial-wrap{ display:flex; justify-content:center; }
  .dial-face{
    width:min(220px,52vw); aspect-ratio:1; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fbf5ff, var(--face) 55%, #c9b3e6 100%);
    position:relative; box-shadow: inset 0 0 0 8px var(--housing-2), 0 6px 18px rgba(0,0,0,.4);
  }
  .dial-face::before{
    content:""; position:absolute; inset:14px; border-radius:50%;
    background: repeating-conic-gradient(var(--ink) 0deg 1.2deg, transparent 1.2deg 9deg);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 12px), #000 calc(100% - 12px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 12px), #000 calc(100% - 12px));
    opacity:.55;
  }
  .dial-needle{
    position:absolute; left:50%; bottom:50%; width:3px; height:42%;
    background:var(--accent); transform-origin:bottom center; border-radius:3px;
    transform: translateX(-50%) rotate(var(--needle-angle,0deg));
    transition: transform .7s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 0 8px rgba(139,92,246,.6);
  }
  .dial-face::after{ content:""; position:absolute; left:50%; bottom:50%; width:12px; height:12px; background:var(--housing-2); border-radius:50%; transform:translate(-50%,50%); }
  .radio-screen{
    background:var(--screen-bg); border-radius:var(--radius-sm); padding:14px 16px;
    display:flex; align-items:center; gap:10px;
  }
  .onair-dot{ width:9px; height:9px; border-radius:50%; background:var(--accent); flex:none; box-shadow:0 0 6px var(--accent); }
  .radio-screen-text{ min-width:0; }
  .np-label{ font-size:.62rem; letter-spacing:.14em; color:var(--led); opacity:.65; font-family:var(--font-b); font-weight:600; }
  .radio-screen .now-playing-text{ color:var(--led); font-size:.95rem; }
  .eq-bars{ display:flex; align-items:flex-end; gap:5px; height:34px; padding:0 2px; }
  .eq-bars span{ flex:1; background:var(--accent); border-radius:2px; height:20%; opacity:.85; }

  /* ===== IPOD ===== */
  .ipod-body{ display:flex; flex-direction:column; align-items:center; gap:22px; max-width:280px; margin:0 auto; }
  .ipod-screen{
    width:100%; background:var(--screen-bg); border-radius:14px; padding:16px 18px;
    box-shadow: inset 0 0 0 1px var(--housing-2);
  }
  .ipod-screen-header{ font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); font-weight:700; margin-bottom:10px; }
  .ipod-np-title{ font-family:var(--font-a); font-weight:700; font-size:1.15rem; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ipod-np-artist{ font-family:var(--font-c); font-size:.8rem; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ipod-progress{ margin-top:12px; height:4px; background:var(--housing-2); border-radius:99px; overflow:hidden; }
  .ipod-progress span{ display:block; height:100%; background:var(--accent); width:0%; transition:width .5s ease; }
  .clickwheel{ position:relative; width:210px; height:210px; border-radius:50%; background:var(--housing-2); }
  .wheel-btn{
    position:absolute; background:none; border:none; color:var(--ink-soft);
    font-family:var(--font-c); font-size:.7rem; font-weight:600; letter-spacing:.05em; cursor:pointer; padding:10px;
  }
  .wheel-menu{ top:8px; left:50%; transform:translateX(-50%); }
  .wheel-prev{ left:6px; top:50%; transform:translateY(-50%); font-size:1rem; }
  .wheel-next{ right:6px; top:50%; transform:translateY(-50%); font-size:1rem; }
  .wheel-play{ bottom:6px; left:50%; transform:translateX(-50%); font-size:.95rem; }
  .center-btn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:78px; height:78px; border-radius:50%; background:var(--housing); border:none; color:var(--accent);
    font-size:1.4rem; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .center-btn.pulse{ animation:pulse .35s ease; }
  @keyframes pulse{ 0%{ transform:translate(-50%,-50%) scale(1);} 50%{ transform:translate(-50%,-50%) scale(.9);} 100%{ transform:translate(-50%,-50%) scale(1);} }

  /* ===== CASSETTE ===== */
  .tape-shell{ display:flex; flex-direction:column; gap:16px; }
  .tape-label{
    background:var(--face); border-radius:6px; padding:12px 16px; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  }
  .tape-title-hand{ font-family:var(--font-c); font-size:1.5rem; color:var(--ink); }
  .tape-sub{ font-family:var(--font-b); font-size:.65rem; letter-spacing:.12em; color:var(--ink-soft); text-transform:uppercase; }
  .tape-window{
    background:var(--housing-2); border-radius:8px; padding:20px; display:flex; justify-content:space-around; align-items:center;
  }
  .reel{ width:64px; height:64px; border-radius:50%; background:radial-gradient(circle,var(--face) 0 22%, var(--housing-2) 23% 30%, var(--face) 31% 100%); position:relative; display:flex; align-items:center; justify-content:center; }
  .reel::before{
    content:""; position:absolute; inset:0; border-radius:50%;
    background: repeating-conic-gradient(var(--housing-2) 0deg 8deg, transparent 8deg 45deg);
    opacity:.8;
  }
  .reel-hub{ width:14px; height:14px; border-radius:50%; background:var(--housing); position:relative; z-index:1; }
  .tape-readout{ display:flex; align-items:center; gap:14px; background:var(--screen-bg); border-radius:6px; padding:12px 16px; }
  .counter{ font-family:var(--font-b); font-weight:700; font-size:1rem; letter-spacing:.1em; color:var(--accent); flex:none; }
  .tape-readout .now-playing-text{ color:var(--ink); font-size:.85rem; }
  .vu-meters{ display:flex; gap:14px; }
  .vu{ flex:1; height:26px; border-radius:4px; background:var(--face); position:relative; overflow:hidden; }
  .vu-needle{ position:absolute; bottom:2px; left:6px; width:60%; height:4px; background:var(--accent); border-radius:2px; }
  .vu-needle.b{ animation-delay:.35s; }

  /* ===== VINYL ===== */
  .turntable{ display:flex; flex-direction:column; align-items:center; gap:22px; position:relative; }
  .platter{ position:relative; width:min(230px,58vw); aspect-ratio:1; }
  .record{
    width:100%; height:100%; border-radius:50%;
    background:
      repeating-radial-gradient(circle at center, #14091f 0 3px, #1c1030 3px 6px);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    position:relative;
  }
  .record-label{ position:absolute; inset:32%; }
  .record-label text{ fill:var(--face); font-family:var(--font-b); }
  .spindle{ position:absolute; top:50%; left:50%; width:10px; height:10px; background:var(--accent); border-radius:50%; transform:translate(-50%,-50%); z-index:2; }
  .tonearm{
    position:absolute; top:6%; right:6%; width:6px; height:52%; background:var(--accent);
    transform-origin: top center; transform: rotate(-28deg); border-radius:3px;
    transition: transform 1s cubic-bezier(.3,.8,.2,1);
  }
  html[data-mode="vinyl"] .tonearm{ transform: rotate(-4deg); }
  .tonearm::before{ content:""; position:absolute; top:-8px; left:50%; transform:translateX(-50%); width:20px; height:20px; border-radius:50%; background:var(--housing-2); }
  .tonearm::after{ content:""; position:absolute; bottom:-4px; left:-6px; width:18px; height:10px; background:var(--accent); border-radius:2px; }
  .vinyl-np{ font-family:var(--font-c); font-style:italic; font-size:1.05rem; color:var(--ink); text-align:center; max-width:280px; }

  /* ---------- motion ---------- */
  @media (prefers-reduced-motion: no-preference){
    .onair-dot{ animation: blink 2.4s ease-in-out infinite; }
    @keyframes blink{ 0%,100%{ opacity:1;} 50%{ opacity:.25;} }
    .eq-bars span{ animation: eq 1.1s ease-in-out infinite; }
    .eq-bars span:nth-child(1){ animation-delay:-.9s; }
    .eq-bars span:nth-child(2){ animation-delay:-.5s; }
    .eq-bars span:nth-child(3){ animation-delay:-1.1s; }
    .eq-bars span:nth-child(4){ animation-delay:-.2s; }
    .eq-bars span:nth-child(5){ animation-delay:-.7s; }
    .eq-bars span:nth-child(6){ animation-delay:-.4s; }
    .eq-bars span:nth-child(7){ animation-delay:-1s; }
    @keyframes eq{ 0%,100%{ height:18%;} 50%{ height:85%;} }
    .reel::before{ animation: spin 6s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .vu-needle{ animation: vu 1.6s ease-in-out infinite; }
    .vu-needle.b{ animation-duration:1.9s; }
    @keyframes vu{ 0%,100%{ width:20%;} 50%{ width:75%;} }
    html[data-mode="vinyl"] .record{ animation: spin 4.5s linear infinite; }
  }

  /* ---------- track panel ---------- */
  .track-panel{ background:var(--list-bg); border-radius:var(--radius-lg); padding:clamp(16px,3vw,26px); }
  .track-controls{ display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-input{
    flex:1; min-width:180px; background:var(--bg-2); border:1px solid var(--line); color:var(--list-ink);
    border-radius:999px; padding:10px 16px; font-size:.9rem;
  }
  .filter-input::placeholder{ color:var(--list-ink-soft); }
  .track-count{ font-size:.75rem; color:var(--list-ink-soft); letter-spacing:.05em; white-space:nowrap; }
  .track-count span{ font-variant-numeric: tabular-nums; color:var(--accent); font-weight:700; }

  .track-list{ max-height:440px; overflow-y:auto; display:flex; flex-direction:column; gap:2px; }
  .side-label{
    font-family:var(--font-a); font-size:.85rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--accent); margin:14px 0 6px; padding-left:4px;
  }
  .side-label:first-child{ margin-top:2px; }
  .track-row{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:transparent; border:none; border-radius:10px; padding:9px 10px; cursor:pointer;
    color:var(--list-ink); transition: background .15s ease;
  }
  .track-row:hover{ background:var(--list-row); }
  .track-row.is-active{ background:var(--accent); }
  .track-row.is-active .track-title, .track-row.is-active .track-artist, .track-row.is-active .track-index{ color:var(--screen-bg); }
  html[data-mode="ipod"] .track-row.is-active *{ color:#fff !important; }
  .track-index{
    font-family:var(--font-c); font-variant-numeric: tabular-nums; font-size:.75rem; color:var(--list-ink-soft);
    width:2.4em; flex:none;
  }
  .track-meta{ min-width:0; display:flex; flex-direction:column; }
  .track-title{ font-family:var(--font-b); font-weight:600; font-size:.92rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track-artist{ font-size:.78rem; color:var(--list-ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .no-results{ padding:24px 8px; text-align:center; color:var(--list-ink-soft); font-size:.9rem; }

  .track-list::-webkit-scrollbar{ width:8px; }
  .track-list::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }

  footer.foot{ text-align:center; color:var(--ink-soft); font-size:.75rem; margin-top:30px; letter-spacing:.03em; }

  @media (max-width:520px){
    .clickwheel{ width:180px; height:180px; }
    .center-btn{ width:66px; height:66px; }
  }
</style>

<div class="page">
  <p class="eyebrow">One playlist, four machines</p>
  <h1 class="title">JIJI List</h1>
  <p class="kicker"><bdi>١٠٣ أغنية وحدة… تسمعينها راديو، آيبود، كاسيت، أو أسطوانة — اختاري الجهاز وشوفي القائمة تتلبّس شكل ثاني.</bdi></p>

  <div class="switcher" role="group" aria-label="Choose player mode">
    <button type="button" class="mode-btn" data-mode-btn="radio" aria-pressed="false"><span class="ico">📻</span>Radio</button>
    <button type="button" class="mode-btn" data-mode-btn="ipod" aria-pressed="false"><span class="ico">🎧</span>iPod</button>
    <button type="button" class="mode-btn" data-mode-btn="cassette" aria-pressed="false"><span class="ico">📼</span>Tape</button>
    <button type="button" class="mode-btn" data-mode-btn="vinyl" aria-pressed="false"><span class="ico">💿</span>Vinyl</button>
  </div>

  <div class="stage">
    <!-- RADIO -->
    <div class="device-visual" data-for="radio">
      <div class="radio-body">
        <div class="radio-top">
          <div class="radio-brand">JIJI <b>FM STEREO</b></div>
        </div>
        <div class="dial-wrap">
          <div class="dial-face" id="dialFace">
            <div class="dial-needle" id="dialNeedle"></div>
          </div>
        </div>
        <div class="radio-screen">
          <span class="onair-dot"></span>
          <div class="radio-screen-text">
            <div class="np-label">NOW PLAYING</div>
            <div class="now-playing-text" data-now-playing>—</div>
          </div>
        </div>
        <div class="eq-bars"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      </div>
    </div>

    <!-- IPOD -->
    <div class="device-visual" data-for="ipod">
      <div class="ipod-body">
        <div class="ipod-screen">
          <div class="ipod-screen-header">JIJI list</div>
          <div class="ipod-np-title" data-now-playing>—</div>
          <div class="ipod-np-artist" data-now-playing-artist>—</div>
          <div class="ipod-progress"><span id="ipodProgress"></span></div>
        </div>
        <div class="clickwheel">
          <button type="button" class="wheel-btn wheel-menu" data-action="menu">MENU</button>
          <button type="button" class="wheel-btn wheel-prev" data-action="prev" aria-label="Previous track">⏮</button>
          <button type="button" class="wheel-btn wheel-next" data-action="next" aria-label="Next track">⏭</button>
          <button type="button" class="wheel-btn wheel-play" data-action="play" aria-label="Play or pause">▶︎ ❚❚</button>
          <button type="button" class="center-btn" id="centerBtn" data-action="select" aria-label="Select">●</button>
        </div>
      </div>
    </div>

    <!-- CASSETTE -->
    <div class="device-visual" data-for="cassette">
      <div class="tape-shell">
        <div class="tape-label">
          <span class="tape-title-hand">JIJI list</span>
          <span class="tape-sub">Side A / Side B</span>
        </div>
        <div class="tape-window">
          <div class="reel"><div class="reel-hub"></div></div>
          <div class="reel"><div class="reel-hub"></div></div>
        </div>
        <div class="tape-readout">
          <div class="counter" id="tapeCounter">000</div>
          <div class="now-playing-text" data-now-playing>—</div>
        </div>
        <div class="vu-meters">
          <div class="vu"><div class="vu-needle"></div></div>
          <div class="vu"><div class="vu-needle b"></div></div>
        </div>
      </div>
    </div>

    <!-- VINYL -->
    <div class="device-visual" data-for="vinyl">
      <div class="turntable">
        <div class="platter">
          <div class="record">
            <svg class="record-label" viewBox="0 0 100 100" aria-hidden="true">

<script>
(function(){

  var SONGS = [

    ["Anthems For A Seventeen Year-Old (Cover)","Broken Social Scene"],
    ["ON DAT BXTCH! (Super Slowed)","velours"],
    ["boys beware","Mad Tsai"],

    ["A New Kind Of Love (Demo)","Guy Sigsworth, Imogen Heap, Frou Frou"],
    ["Love Of Your Life","RAYE"],

    ["Carousel","Melanie Martinez"]
  ];

  var PLACEHOLDERS = {
    radio: "ابحثي عن محطة…",
    ipod: "Search your library…",
    cassette: "Find it on the tape…",
    vinyl: "Browse the crate…"
  };

  var MODES = ["radio","ipod","cassette","vinyl"];
  var root = document.documentElement;
  var trackListEl = document.getElementById("trackList");
  var filterInput = document.getElementById("filterInput");
  var countEl = document.querySelector("[data-count]");
  var modeButtons = Array.prototype.slice.call(document.querySelectorAll("[data-mode-btn]"));
  var dialNeedle = document.getElementById("dialNeedle");
  var ipodProgress = document.getElementById("ipodProgress");
  var tapeCounter = document.getElementById("tapeCounter");
  var centerBtn = document.getElementById("centerBtn");

  var currentMode = "radio";
  var selectedIndex = 0;

  function storage(){
    try{ return window.localStorage; }catch(e){ return null; }
  }
  function loadState(){
    var s = storage();
    if(!s) return;
    try{
      var m = s.getItem("jiji-mode");
      var i = s.getItem("jiji-index");
      if(m && MODES.indexOf(m) !== -1) currentMode = m;
      if(i !== null && !isNaN(parseInt(i,10))){
        var n = parseInt(i,10);
        if(n >= 0 && n < SONGS.length) selectedIndex = n;
      }
    }catch(e){}
  }
  function saveState(){
    var s = storage();
    if(!s) return;
    try{
      s.setItem("jiji-mode", currentMode);
      s.setItem("jiji-index", String(selectedIndex));
    }catch(e){}
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  function renderRows(list){
    if(list.length === 0){
      return '<p class="no-results">ما لقينا أغنية بهالاسم…</p>';
    }
    var html = "";
    for(var k=0;k<list.length;k++){
      var idx = list[k][2];
      var t = escapeHtml(list[k][0]);
      var a = escapeHtml(list[k][1]);
      var active = idx === selectedIndex ? " is-active" : "";
      html += '<button type="button" class="track-row' + active + '" role="option" aria-selected="' + (idx===selectedIndex) + '" data-index="' + idx + '">' +
        '<span class="track-index">' + String(idx+1).padStart(3,"0") + '</span>' +
        '<span class="track-meta"><span class="track-title">' + t + '</span><span class="track-artist">' + a + '</span></span>' +
        '</button>';
    }
    return html;
  }

  function renderList(){
    var q = filterInput.value.trim().toLowerCase();
    var withIndex = SONGS.map(function(s,i){ return [s[0], s[1], i]; });
    var filtered = q ? withIndex.filter(function(s){
      return (s[0] + " " + s[1]).toLowerCase().indexOf(q) !== -1;
    }) : withIndex;

    countEl.textContent = filtered.length;

    var html = "";
    if(currentMode === "vinyl" && !q){
      var half = Math.ceil(filtered.length/2);
      html += '<h3 class="side-label">Side A</h3>' + renderRows(filtered.slice(0,half));
      html += '<h3 class="side-label">Side B</h3>' + renderRows(filtered.slice(half));
    } else {
      html += renderRows(filtered);
    }
    trackListEl.innerHTML = html;
  }

  function updateNowPlaying(){
    var song = SONGS[selectedIndex];
    if(!song) return;
    var title = song[0], artist = song[1];
    var titleEls = document.querySelectorAll("[data-now-playing]");
    titleEls.forEach(function(el){ el.textContent = title; });
    var artistEls = document.querySelectorAll("[data-now-playing-artist]");
    artistEls.forEach(function(el){ el.textContent = artist; });

    var angle = -62 + (selectedIndex/(SONGS.length-1)) * 124;
    dialNeedle.style.setProperty("--needle-angle", angle.toFixed(1) + "deg");

    var pct = ((selectedIndex+1)/SONGS.length) * 100;
    ipodProgress.style.width = pct.toFixed(1) + "%";

    var count = (selectedIndex * 37) % 999;
    tapeCounter.textContent = String(count).padStart(3,"0");
  }

  function markActiveRows(){
    var rows = trackListEl.querySelectorAll(".track-row");
    rows.forEach(function(row){
      var idx = parseInt(row.getAttribute("data-index"),10);
      var active = idx === selectedIndex;
      row.classList.toggle("is-active", active);
      row.setAttribute("aria-selected", active ? "true" : "false");
    });
  }

  function selectSong(i, opts){
    if(i < 0) i = 0;
    if(i >= SONGS.length) i = SONGS.length - 1;
    selectedIndex = i;
    updateNowPlaying();
    markActiveRows();
    saveState();
    if(opts && opts.scroll){
      var row = trackListEl.querySelector('.track-row[data-index="' + i + '"]');
      if(row){ row.scrollIntoView({ block: "nearest" }); }
    }
  }

  function setMode(mode){
    if(MODES.indexOf(mode) === -1) mode = "radio";
    currentMode = mode;
    root.setAttribute("data-mode", mode);
    modeButtons.forEach(function(btn){
      btn.setAttribute("aria-pressed", btn.getAttribute("data-mode-btn") === mode ? "true" : "false");
    });
    filterInput.placeholder = PLACEHOLDERS[mode];
    renderList();
    updateNowPlaying();
    markActiveRows();
    saveState();
  }

  modeButtons.forEach(function(btn){
    btn.addEventListener("click", function(){
      setMode(btn.getAttribute("data-mode-btn"));
    });
  });

  trackListEl.addEventListener("click", function(e){
    var row = e.target.closest(".track-row");
    if(!row) return;
    selectSong(parseInt(row.getAttribute("data-index"),10));
  });

  filterInput.addEventListener("input", function(){
    renderList();
    markActiveRows();
  });

  document.querySelectorAll("[data-action]").forEach(function(el){
    el.addEventListener("click", function(){
      var action = el.getAttribute("data-action");
      if(action === "prev"){ selectSong(selectedIndex - 1, { scroll:true }); }
      else if(action === "next"){ selectSong(selectedIndex + 1, { scroll:true }); }
      else if(action === "menu"){ filterInput.value = ""; renderList(); markActiveRows(); trackListEl.scrollTop = 0; }
      else if(action === "select" || action === "play"){
        centerBtn.classList.remove("pulse");
        void centerBtn.offsetWidth;
        centerBtn.classList.add("pulse");
        var row = trackListEl.querySelector('.track-row[data-index="' + selectedIndex + '"]');
        if(row){ row.scrollIntoView({ block:"nearest" }); }
      }
    });
  });

  loadState();
  setMode(currentMode);
  selectSong(selectedIndex);
})();
</script>
