<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIGI LIST ♡ Listening Room</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#342947;background:radial-gradient(circle at 75% 5%,#ffc8df 0,transparent 40%),linear-gradient(135deg,#efe4ff,#fef7fc);min-height:100vh}.top{padding:25px 6%;font-weight:900;letter-spacing:3px;font-size:24px}.top span{color:#d285ba}.layout{display:grid;grid-template-columns:1fr 340px;gap:24px;max-width:1150px;margin:auto;padding:20px}.panel{background:#fffc;border:1px solid #fff;border-radius:30px;padding:25px;box-shadow:0 20px 60px #9e82b13d}h1{font-family:Georgia,serif;font-size:56px;line-height:1.08;margin:10px 0}em{color:#b88ccd}p{color:#77677f}.song{width:100%;text-align:left;background:#faf4ff;border:1px solid #ede2f1;border-radius:16px;margin:8px 0;padding:15px;cursor:pointer;color:#564069;font-size:15px}.song:hover{background:#ead6f6}.song small{display:block;color:#97819e;margin-top:5px}.device{margin:12px auto;background:linear-gradient(135deg,#fefcff,#ceb6e9 55%,#f8f0fa);border:3px solid #fff;border-radius:40px;padding:22px;width:268px;box-shadow:inset -12px -15px 20px #b9a5c375,15px 22px 45px #826b9580}.screen{background:#d4c6e0;border:5px solid #eee4ef;border-radius:15px;height:165px;padding:16px;text-align:center;overflow:hidden}.disc{font-size:72px;line-height:1.2}.wheel{height:187px;width:187px;border-radius:50%;background:#fffdfd;margin:21px auto 0;display:grid;place-items:center;box-shadow:inset 3px 5px 13px #bca6d4}.wheel button{background:#e7d6fa;border:0;border-radius:50%;width:80px;height:80px;font-size:24px;cursor:pointer}.youtube{width:100%;aspect-ratio:16/9;border:0;border-radius:16px}.extra{margin-top:18px}input{max-width:100%}@media(max-width:800px){.layout{grid-template-columns:1fr}h1{font-size:42px}}</style><header class="top">gigi<span>.</span>list ✳</header><div class="layout"><main class="panel"><small>✦ YOUR LITTLE LISTENING ROOM</small><h1>Sounds like <em>you.</em></h1><p>A shareable preview with playable official YouTube embeds. Choose a song below, or add local audio from your device.</p><h2>♫ Listen together</h2><div id="songs"></div><div class="extra"><strong>Import your own files — no upload</strong><p><input type="file" multiple accept="audio/*,.m4a,.mp3,.mp4" id="files"></p></div></main><aside class="panel"><div class="device"><div class="screen"><small>gigi's iPod ♡</small><div class="disc">💿</div><div id="playing">Choose a song</div></div><div class="wheel"><button id="next" title="Next">▶▶</button></div></div><div id="embed"></div><audio id="audio" controls style="display:none;width:100%"></audio><p id="status">Pick a track ♡</p></aside></div><script>let tracks=[{title:"Blue Hair",artist:"TV Girl",id:"abW7Cr9Vo_M"},{title:"THE DINER",artist:"Billie Eilish",id:"gDVw1l6QDOg"},{title:"Espresso",artist:"Sabrina Carpenter",id:"D8j5Fm94_CE"}],current=-1;const el=x=>document.getElementById(x);function render(){el('songs').replaceChildren(...tracks.map((t,i)=>{let b=document.createElement('button');b.className='song';b.textContent='♫ '+t.title;let s=document.createElement('small');s.textContent=t.artist;b.appendChild(s);b.onclick=()=>play(i);return b}))}function play(i){current=i;let t=tracks[i];el('playing').textContent=t.title;el('status').textContent='Now playing: '+t.title;el('audio').pause();if(t.file){el('embed').replaceChildren();el('audio').style.display='block';el('audio').src=t.file;el('audio').play().catch(()=>{});}else{el('audio').style.display='none';let f=document.createElement('iframe');f.className='youtube';f.allow='accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture';f.allowFullscreen=true;f.src='https://www.youtube.com/embed/'+t.id+'?autoplay=1';el('embed').replaceChildren(f)}}el('next').onclick=()=>{if(tracks.length)play((current+1+Math.floor(Math.random()*(tracks.length-1||1)))%tracks.length)};el('files').onchange=e=>{let added=Array.from(e.target.files).map(f=>({title:f.name.replace(/\.[^.]+$/,''),artist:'From your device',file:URL.createObjectURL(f)}));tracks.push(...added);render();el('status').textContent=added.length+' files added locally';};render();</script></html>
